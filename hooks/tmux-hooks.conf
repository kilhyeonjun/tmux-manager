# tmux-manager — hook registration
# Sourced from init.sh when inside an interactive tmux session.
# Uses $TMUX_MANAGER_DIR from the calling scope.

# Assign UUID to new sessions
tmux set-hook -g session-created \
  "run-shell \"$TMUX_MANAGER_DIR/hooks/on-session-created.sh \\\"#{hook_session_name}\\\"\""

# Refresh status bar segments on window/pane changes
tmux set-hook -g after-select-window \
  "run-shell -b 'zsh $TMUX_MANAGER_DIR/lib/status.sh refresh_tabs'"

tmux set-hook -g session-window-changed \
  "run-shell -b 'zsh $TMUX_MANAGER_DIR/lib/status.sh refresh_tabs'"

tmux set-hook -g after-split-window \
  "run-shell -b 'zsh $TMUX_MANAGER_DIR/lib/status.sh refresh_tabs'"

# Pane border display
tmux set -g pane-border-status top
tmux set -g pane-border-format \
  " #{pane_index} #{=/12/..:pane_title}#{?#{@pbranch},#{@pbranch},}#{?#{@poc},#{@poc},}#{?#{@pmetrics},#{@pmetrics},} "
