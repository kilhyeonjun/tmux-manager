# tmux-manager defaults
# Override in your shell profile before sourcing init.sh

TMUX_ARCHIVE_DIR="${TMUX_ARCHIVE_DIR:-$HOME/.tmux/archives}"
TMUX_ARCHIVE_AUTO_SCROLLBACK_LINES="${TMUX_ARCHIVE_AUTO_SCROLLBACK_LINES:-200}"
TMUX_ARCHIVE_AUTO_MAX_PER_UUID="${TMUX_ARCHIVE_AUTO_MAX_PER_UUID:-10}"
TMUX_ARCHIVE_AUTO_MAX_AGE_DAYS="${TMUX_ARCHIVE_AUTO_MAX_AGE_DAYS:-0}"
TMUX_ARCHIVE_AUTO_CLEANUP="${TMUX_ARCHIVE_AUTO_CLEANUP:-1}"
TMUX_MANAGER_DEBOUNCE_SEC="${TMUX_MANAGER_DEBOUNCE_SEC:-2}"
TMUX_MANAGER_PLUGINS_DIR="${TMUX_MANAGER_PLUGINS_DIR:-$TMUX_MANAGER_DIR/plugins}"
TMUX_MANAGER_AUTO_LAUNCH="${TMUX_MANAGER_AUTO_LAUNCH:-0}"
