name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: |
          shellcheck -x -s bash \
            init.sh \
            lib/utils.sh \
            lib/metrics.sh \
            lib/core.sh \
            lib/restore.sh \
            lib/status.sh \
            lib/preview.sh \
            plugins/opencode.sh \
            plugins/claude-code.sh \
            hooks/on-session-created.sh \
            hooks/tmux-hooks.conf \
            cron/autoarchive.sh \
            conf/defaults.conf

  bats:
    name: Bats Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: brew install bats-core
      - name: Run unit tests
        run: |
          bats \
            tests/test_archive_format.bats \
            tests/test_core.bats \
            tests/test_metrics.bats \
            tests/test_opencode.bats \
            tests/test_claude_code.bats \
            tests/test_preview.bats \
            tests/test_quickwins.bats \
            tests/test_spacing_regression.bats \
            tests/test_status.bats

  integration-macos:
    name: Integration (tmux)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install integration dependencies
        run: brew install bats-core tmux fzf
      - name: Run tmux integration tests
        run: bats tests/test_integration_tmux.bats
